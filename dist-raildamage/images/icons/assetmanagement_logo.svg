<!--Kugghjul för Tillgångsförvaltning. Samma familj som WebP-ikonerna:
    heltäckande orange silhuett, hålet i mitten är en genomsiktlig urtagning
    precis som fönstren i tågikonen. SVG istället för 256px WebP eftersom det
    inte finns någon rasterisering i repot; byt mot familjens riktiga ikon när
    den finns.-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img">
    <mask id="hub">
        <rect width="256" height="256" fill="#fff" />
        <circle cx="128" cy="128" r="32" fill="#000" />
    </mask>
    <g fill="#ff4b00" mask="url(#hub)">
        <rect x="110" y="14" width="36" height="228" rx="8" />
        <rect x="110" y="14" width="36" height="228" rx="8" transform="rotate(45 128 128)" />
        <rect x="110" y="14" width="36" height="228" rx="8" transform="rotate(90 128 128)" />
        <rect x="110" y="14" width="36" height="228" rx="8" transform="rotate(135 128 128)" />
        <circle cx="128" cy="128" r="80" />
    </g>
</svg>
